# Creates paid resources when activated. Review the displayed Render quote first.
# Optional managed-hosting blueprint. See docs/archive/RENDER_DEPLOYMENT_GUIDE_2026-10-08.md before activation.
services:
  - type: web
    name: new-x1-api
    runtime: docker
    region: singapore
    plan: 1c-2g
    dockerfilePath: ./Dockerfile
    healthCheckPath: /live
    maxShutdownDelaySeconds: 120
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: staging
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: RELEASE_BUCKET
        sync: false
      - key: RELEASE_PREFIX
        value: new-x1
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RELEASE_POLL_SECONDS
        value: "300"
      - key: PHONE_AUTH_ENABLED
        value: "false"
  - type: web
    name: new-x1-web
    runtime: node
    region: singapore
    plan: 0.5c-512mb
    rootDir: frontend
    buildCommand: npm ci && npm run build && npm run prepare:standalone
    startCommand: node .next/standalone/server.js
    healthCheckPath: /account
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTNAME
        value: 0.0.0.0
      - key: NEXT_PUBLIC_API_BASE
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NEXT_PUBLIC_PHONE_AUTH_ENABLED
        value: "false"
  - type: cron
    name: new-x1-daily-sync
    runtime: docker
    region: singapore
    plan: 2c-8g
    dockerfilePath: ./Dockerfile
    dockerCommand: python -m pipeline.worker
    schedule: "30 20 * * *" # Daily 02:00 IST; Render schedules use UTC.
    autoDeployTrigger: checksPass
    envVars:
      - key: APP_ENV
        value: staging
      - key: RELEASE_BUCKET
        sync: false
      - key: RELEASE_PREFIX
        value: new-x1
      - key: AWS_DEFAULT_REGION
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: RAPID_API_KEY
        sync: false
      - key: CRICKET_DATA_API_KEY
        sync: false
      - key: SQUAD_REQUEST_BUDGET
        value: "3"
